<svg width="800" height="200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00c6ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0072ff;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="800" height="200" fill="url(#grad)" rx="15" />
  <circle cx="100" cy="100" r="20" fill="#fff">
    <animate attributeName="cx" values="100;700;100" dur="5s" repeatCount="indefinite" />
  </circle>
  <text x="50%" y="55%" dominant-baseline="middle" text-anchor="middle" font-family="Arial, sans-serif" font-size="36" fill="#fff" font-weight="bold">
    Awesome Warehouse Robotics Platform 🤖
  </text>
  <text x="50%" y="75%" dominant-baseline="middle" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#e0e0e0">
    AMRs, AGVs, Orchestration &amp; Automation
  </text>
</svg>